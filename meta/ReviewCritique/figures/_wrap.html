</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1346" height="568" viewBox="0 0 1346 568" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="1346" height="568" fill="#ffffff"/>
<text x="20" y="17" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 1</text>
<rect x="18" y="22" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="18" y="22" width="4" height="70" rx="2" fill="#E15759"/><text x="31" y="41" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Vague Critique</text><text x="308" y="41" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="31" y="55" font-size="11.5" fill="#1b1b1b">Not much novelty in the methodological</text><text x="31" y="70" font-size="11.5" fill="#1b1b1b">aspects of the work.</text>
<rect x="352" y="22" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="352" y="22" width="4" height="70" rx="2" fill="#4E79A7"/><text x="365" y="41" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="642" y="41" text-anchor="end" font-size="9" fill="#6b6b6b">R3</text><text x="365" y="55" font-size="11.5" fill="#1b1b1b">Novelty is primarily empirical; the approach</text><text x="365" y="70" font-size="11.5" fill="#1b1b1b">applies known techniques.</text>

<text x="696" y="17" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 28</text>
<rect x="694" y="22" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="694" y="22" width="4" height="70" rx="2" fill="#E15759"/><text x="707" y="41" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Subjective</text><text x="984" y="41" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="707" y="55" font-size="11.5" fill="#1b1b1b">No novel / brand new ideas.</text>
<rect x="1028" y="22" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="1028" y="22" width="4" height="70" rx="2" fill="#4E79A7"/><text x="1041" y="41" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="1318" y="41" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="1041" y="55" font-size="11.5" fill="#1b1b1b">The novelty of this paper is limited.</text>

<text x="20" y="107" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 60</text>
<rect x="18" y="112" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="18" y="112" width="4" height="70" rx="2" fill="#E15759"/><text x="31" y="131" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Neglect</text><text x="308" y="131" text-anchor="end" font-size="9" fill="#6b6b6b">R3</text><text x="31" y="145" font-size="11.5" fill="#1b1b1b">The work is not reproducible, w.r.t. both</text><text x="31" y="160" font-size="11.5" fill="#1b1b1b">methods and datasets.</text>
<rect x="352" y="112" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="352" y="112" width="4" height="70" rx="2" fill="#4E79A7"/><text x="365" y="131" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="642" y="131" text-anchor="end" font-size="9" fill="#6b6b6b">R4</text><text x="365" y="145" font-size="11.5" fill="#1b1b1b">Setup details are missing, making results</text><text x="365" y="160" font-size="11.5" fill="#1b1b1b">hard to reproduce.</text>

<text x="696" y="107" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 46</text>
<rect x="694" y="112" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="694" y="112" width="4" height="70" rx="2" fill="#E15759"/><text x="707" y="131" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Misunderstanding</text><text x="984" y="131" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="707" y="145" font-size="11.5" fill="#1b1b1b">Many Transformer variants exist, but none is</text><text x="707" y="160" font-size="11.5" fill="#1b1b1b">compared.</text>
<rect x="1028" y="112" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="1028" y="112" width="4" height="70" rx="2" fill="#4E79A7"/><text x="1041" y="131" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="1318" y="131" text-anchor="end" font-size="9" fill="#6b6b6b">R4</text><text x="1041" y="145" font-size="11.5" fill="#1b1b1b">My major concern is the lack of comparison</text><text x="1041" y="160" font-size="11.5" fill="#1b1b1b">of other baselines.</text>

<text x="20" y="197" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 20</text>
<rect x="18" y="202" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="18" y="202" width="4" height="70" rx="2" fill="#E15759"/><text x="31" y="221" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Vague Critique</text><text x="308" y="221" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="31" y="235" font-size="11.5" fill="#1b1b1b">Improvements over the baselines are not</text><text x="31" y="250" font-size="11.5" fill="#1b1b1b">fully convincing.</text>
<rect x="352" y="202" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="352" y="202" width="4" height="70" rx="2" fill="#4E79A7"/><text x="365" y="221" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="642" y="221" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="365" y="235" font-size="11.5" fill="#1b1b1b">The performance gains (esp. the new loss)</text><text x="365" y="250" font-size="11.5" fill="#1b1b1b">are marginal.</text>
<line x1="318" y1="237.0" x2="352" y2="237.0" stroke="#cfd4da" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="335.0" cy="237.0" r="11" fill="#fff" stroke="#cfd4da" stroke-width="1"/>

<text x="696" y="197" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 55</text>
<rect x="694" y="202" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="694" y="202" width="4" height="70" rx="2" fill="#E15759"/><text x="707" y="221" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Vague Critique</text><text x="984" y="221" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="707" y="235" font-size="11.5" fill="#1b1b1b">Lots of experimental results that are not</text><text x="707" y="250" font-size="11.5" fill="#1b1b1b">well explained.</text>
<rect x="1028" y="202" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="1028" y="202" width="4" height="70" rx="2" fill="#4E79A7"/><text x="1041" y="221" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="1318" y="221" text-anchor="end" font-size="9" fill="#6b6b6b">R3</text><text x="1041" y="235" font-size="11.5" fill="#1b1b1b">Hard to understand the experiments without</text><text x="1041" y="250" font-size="11.5" fill="#1b1b1b">the appendix.</text>

<text x="20" y="287" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 66</text>
<rect x="18" y="292" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="18" y="292" width="4" height="70" rx="2" fill="#E15759"/><text x="31" y="311" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Misunderstanding</text><text x="308" y="311" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="31" y="325" font-size="11.5" fill="#1b1b1b">The performance of downstream tasks can also</text><text x="31" y="340" font-size="11.5" fill="#1b1b1b">be important.</text>
<rect x="352" y="292" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="352" y="292" width="4" height="70" rx="2" fill="#4E79A7"/><text x="365" y="311" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="642" y="311" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="365" y="325" font-size="11.5" fill="#1b1b1b">I encourage the authors to also observe</text><text x="365" y="340" font-size="11.5" fill="#1b1b1b">downstream performance.</text>
<line x1="318" y1="327.0" x2="352" y2="327.0" stroke="#cfd4da" stroke-width="1" stroke-dasharray="3 2"/>

<text x="696" y="287" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 50</text>
<rect x="694" y="292" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="694" y="292" width="4" height="70" rx="2" fill="#E15759"/><text x="707" y="311" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Misunderstanding</text><text x="984" y="311" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="707" y="325" font-size="11.5" fill="#1b1b1b">The claim that flatness decides downstream</text><text x="707" y="340" font-size="11.5" fill="#1b1b1b">perf. is not well-supported.</text>
<rect x="1028" y="292" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="1028" y="292" width="4" height="70" rx="2" fill="#4E79A7"/><text x="1041" y="311" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="1318" y="311" text-anchor="end" font-size="9" fill="#6b6b6b">R3</text><text x="1041" y="325" font-size="11.5" fill="#1b1b1b">Unclear that flatter minima lead to better</text><text x="1041" y="340" font-size="11.5" fill="#1b1b1b">generalization.</text>
<line x1="994" y1="327.0" x2="1028" y2="327.0" stroke="#cfd4da" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="1011.0" cy="327.0" r="11" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="1011.0" y="331.0" text-anchor="middle" font-size="12" fill="#6b6b6b">≈</text>
<text x="20" y="377" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 55</text>
<rect x="18" y="382" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="18" y="382" width="4" height="70" rx="2" fill="#E15759"/><text x="31" y="401" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Neglect</text><text x="308" y="401" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="31" y="415" font-size="11.5" fill="#1b1b1b">Uses “fairness” without explaining how it is</text><text x="31" y="430" font-size="11.5" fill="#1b1b1b">measured.</text>
<rect x="352" y="382" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="352" y="382" width="4" height="70" rx="2" fill="#4E79A7"/><text x="365" y="401" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="642" y="401" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="365" y="415" font-size="11.5" fill="#1b1b1b">Authors could be clearer on what fairness</text><text x="365" y="430" font-size="11.5" fill="#1b1b1b">metric is used.</text>

<text x="335.0" y="421.0" text-anchor="middle" font-size="12" fill="#6b6b6b">≈</text>
<text x="696" y="377" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 93</text>
<rect x="694" y="382" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="694" y="382" width="4" height="70" rx="2" fill="#4E79A7"/><text x="707" y="401" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="984" y="401" text-anchor="end" font-size="9" fill="#6b6b6b">R1</text><text x="707" y="415" font-size="11.5" fill="#1b1b1b">Not clear where results are significantly</text><text x="707" y="430" font-size="11.5" fill="#1b1b1b">different among systems.</text>
<rect x="1028" y="382" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="1028" y="382" width="4" height="70" rx="2" fill="#E15759"/><text x="1041" y="401" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Inexpert Statement</text><text x="1318" y="401" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="1041" y="415" font-size="11.5" fill="#1b1b1b">Methods perform only comparably to the</text><text x="1041" y="430" font-size="11.5" fill="#1b1b1b">ensemble, not significantly better.</text>

<text x="1011.0" y="421.0" text-anchor="middle" font-size="12" fill="#6b6b6b">≈</text>
<text x="20" y="467" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 35</text>
<rect x="18" y="472" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="18" y="472" width="4" height="70" rx="2" fill="#4E79A7"/><text x="31" y="491" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="308" y="491" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="31" y="505" font-size="11.5" fill="#1b1b1b">Unifies existing approaches for prompt</text><text x="31" y="520" font-size="11.5" fill="#1b1b1b">tuning; marginally novel.</text>
<rect x="352" y="472" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="352" y="472" width="4" height="70" rx="2" fill="#E15759"/><text x="365" y="491" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Misinterpret Novelty</text><text x="642" y="491" text-anchor="end" font-size="9" fill="#6b6b6b">R4</text><text x="365" y="505" font-size="11.5" fill="#1b1b1b">The actual method is a simple combination of</text><text x="365" y="520" font-size="11.5" fill="#1b1b1b">existing ideas.</text>

<text x="696" y="467" font-size="9" font-weight="600" fill="#6b6b6b">PAPER 97</text>
<rect x="694" y="472" width="300" height="70" rx="6" fill="#e9eef5"/><rect x="694" y="472" width="4" height="70" rx="2" fill="#4E79A7"/><text x="707" y="491" font-size="10" font-weight="700" fill="#4E79A7" letter-spacing="0.2">RELIABLE</text><text x="984" y="491" text-anchor="end" font-size="9" fill="#6b6b6b">R2</text><text x="707" y="505" font-size="11.5" fill="#1b1b1b">Authors should answer: how could findings</text><text x="707" y="520" font-size="11.5" fill="#1b1b1b">benefit the community?</text>
<rect x="1028" y="472" width="300" height="70" rx="6" fill="#fbeaea"/><rect x="1028" y="472" width="4" height="70" rx="2" fill="#E15759"/><text x="1041" y="491" font-size="10" font-weight="700" fill="#E15759" letter-spacing="0.2">UNRELIABLE · Neglect</text><text x="1318" y="491" text-anchor="end" font-size="9" fill="#6b6b6b">R3</text><text x="1041" y="505" font-size="11.5" fill="#1b1b1b">Didn&#x27;t convey an incentive for this.</text>
