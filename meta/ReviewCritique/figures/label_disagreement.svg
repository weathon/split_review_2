<svg xmlns="http://www.w3.org/2000/svg" width="856" height="490" viewBox="0 0 856 490" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="856" height="490" fill="#ffffff"/>
<text x="20" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(a) near-identical weaknesses, opposite labels</text>
<text x="546" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(b) clear-cut labels</text>
<line x1="516" y1="12" x2="516" y2="478" stroke="#c9ced6" stroke-width="1.2"/>
<rect x="20" y="34" width="222" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="34" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="52" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Subjective</text><text x="233" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="64" font-size="11" fill="#1b1b1b">No novel / brand new ideas.</text>
<rect x="264" y="34" width="222" height="64" rx="6" fill="#e9eef5"/><rect x="264" y="34" width="4" height="64" rx="2" fill="#4E79A7"/><text x="276" y="52" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="477" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="276" y="64" font-size="11" fill="#1b1b1b">The novelty of this paper is</text><text x="276" y="78" font-size="11" fill="#1b1b1b">limited.</text>
<circle cx="253.0" cy="66.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="253.0" y="70.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="31" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 28</text>
<rect x="20" y="113" width="222" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="113" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="131" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="233" y="131" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="143" font-size="11" fill="#1b1b1b">Not reproducible, w.r.t. both</text><text x="32" y="157" font-size="11" fill="#1b1b1b">methods and datasets.</text>
<rect x="264" y="113" width="222" height="64" rx="6" fill="#e9eef5"/><rect x="264" y="113" width="4" height="64" rx="2" fill="#4E79A7"/><text x="276" y="131" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="477" y="131" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="276" y="143" font-size="11" fill="#1b1b1b">Setup details are missing, making</text><text x="276" y="157" font-size="11" fill="#1b1b1b">results hard to reproduce.</text>
<circle cx="253.0" cy="145.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="253.0" y="149.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="110" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 60</text>
<rect x="20" y="192" width="222" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="192" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="210" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Misunderstanding</text><text x="233" y="210" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="32" y="222" font-size="11" fill="#1b1b1b">Many Transformer variants exist, but</text><text x="32" y="236" font-size="11" fill="#1b1b1b">none is compared.</text>
<rect x="264" y="192" width="222" height="64" rx="6" fill="#e9eef5"/><rect x="264" y="192" width="4" height="64" rx="2" fill="#4E79A7"/><text x="276" y="210" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="477" y="210" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="276" y="222" font-size="11" fill="#1b1b1b">My major concern is the lack of</text><text x="276" y="236" font-size="11" fill="#1b1b1b">comparison of other baselines.</text>
<circle cx="253.0" cy="224.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="253.0" y="228.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="189" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 46</text>
<rect x="20" y="271" width="222" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="271" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="289" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Vague Critique</text><text x="233" y="289" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="301" font-size="11" fill="#1b1b1b">Improvements over the baselines are</text><text x="32" y="315" font-size="11" fill="#1b1b1b">not fully convincing.</text>
<rect x="264" y="271" width="222" height="64" rx="6" fill="#e9eef5"/><rect x="264" y="271" width="4" height="64" rx="2" fill="#4E79A7"/><text x="276" y="289" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="477" y="289" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="276" y="301" font-size="11" fill="#1b1b1b">The performance gains are marginal.</text>
<circle cx="253.0" cy="303.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="253.0" y="307.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="268" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 20</text>
<rect x="20" y="350" width="222" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="350" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="368" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="233" y="368" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="380" font-size="11" fill="#1b1b1b">Didn&#x27;t convey an incentive for this.</text>
<rect x="264" y="350" width="222" height="64" rx="6" fill="#e9eef5"/><rect x="264" y="350" width="4" height="64" rx="2" fill="#4E79A7"/><text x="276" y="368" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="477" y="368" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="276" y="380" font-size="11" fill="#1b1b1b">Authors should answer: how do the</text><text x="276" y="394" font-size="11" fill="#1b1b1b">findings benefit the community?</text>
<circle cx="253.0" cy="382.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/>
<text x="253.0" y="386.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="347" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 97</text>
<rect x="546" y="34" width="290" height="87" rx="6" fill="#e9eef5"/><rect x="546" y="34" width="4" height="87" rx="2" fill="#4E79A7"/><text x="560" y="54" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="560" y="67" font-size="11" fill="#1b1b1b">In many tasks the 6B model already beats</text><text x="560" y="82" font-size="11" fill="#1b1b1b">the 175B without the proposed weak-</text><text x="560" y="97" font-size="11" fill="#1b1b1b">supervision aggregation.</text>
<rect x="546" y="135" width="290" height="57" rx="6" fill="#fbeaea"/><rect x="546" y="135" width="4" height="57" rx="2" fill="#E15759"/><text x="560" y="155" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="560" y="168" font-size="11" fill="#1b1b1b">Results are not particularly surprising.</text>
<rect x="546" y="206" width="290" height="87" rx="6" fill="#e9eef5"/><rect x="546" y="206" width="4" height="87" rx="2" fill="#4E79A7"/><text x="560" y="226" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="560" y="239" font-size="11" fill="#1b1b1b">The observation experiments are not</text><text x="560" y="254" font-size="11" fill="#1b1b1b">extensive enough — why only 3 tasks (CB,</text><text x="560" y="269" font-size="11" fill="#1b1b1b">WSC, RTE)?</text>
<rect x="546" y="307" width="290" height="72" rx="6" fill="#fbeaea"/><rect x="546" y="307" width="4" height="72" rx="2" fill="#E15759"/><text x="560" y="327" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="560" y="340" font-size="11" fill="#1b1b1b">The way to add structural locality is</text><text x="560" y="355" font-size="11" fill="#1b1b1b">straightforward.</text>
<rect x="546" y="393" width="290" height="87" rx="6" fill="#e9eef5"/><rect x="546" y="393" width="4" height="87" rx="2" fill="#4E79A7"/><text x="560" y="413" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="560" y="426" font-size="11" fill="#1b1b1b">Only one pretrained model (T5-small) is</text><text x="560" y="441" font-size="11" fill="#1b1b1b">tested, so findings may not transfer to</text><text x="560" y="456" font-size="11" fill="#1b1b1b">larger models.</text>
</svg>