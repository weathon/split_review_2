<svg xmlns="http://www.w3.org/2000/svg" width="932" height="677" viewBox="0 0 932 677" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="932" height="677" fill="#ffffff"/>
<text x="229.0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6b6b">REVIEWER A</text>
<text x="703.0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6b6b">REVIEWER B</text>
<rect x="36" y="44" width="386" height="111" rx="8" fill="#fbeaea" stroke="#E15759" stroke-width="1.5"/><rect x="50" y="58" width="8" height="8" rx="2" fill="#E15759"/><text x="66" y="66" font-size="11.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Vague Critique</text><text x="408" y="66" text-anchor="end" font-size="10.5" fill="#6b6b6b">R1</text><text x="50" y="88" font-size="12.5" fill="#1a1a1a">There is not much novelty in the methodological</text><text x="50" y="105" font-size="12.5" fill="#1a1a1a">aspects of the work.</text>
<rect x="510" y="44" width="386" height="111" rx="8" fill="#e9eef5" stroke="#4E79A7" stroke-width="1.5"/><rect x="524" y="58" width="8" height="8" rx="2" fill="#4E79A7"/><text x="540" y="66" font-size="11.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="882" y="66" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="524" y="88" font-size="12.5" fill="#1a1a1a">The novelty is primarily empirical; the technical</text><text x="524" y="105" font-size="12.5" fill="#1a1a1a">approach is essentially an application of known</text><text x="524" y="122" font-size="12.5" fill="#1a1a1a">techniques (standard pretrain-finetune of LLMs).</text>
<line x1="422" y1="99.5" x2="510" y2="99.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="99.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="104.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="38" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 1</text>
<rect x="36" y="181" width="386" height="77" rx="8" fill="#fbeaea" stroke="#E15759" stroke-width="1.5"/><rect x="50" y="195" width="8" height="8" rx="2" fill="#E15759"/><text x="66" y="203" font-size="11.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Subjective</text><text x="408" y="203" text-anchor="end" font-size="10.5" fill="#6b6b6b">R1</text><text x="50" y="225" font-size="12.5" fill="#1a1a1a">No novel / brand new ideas.</text>
<rect x="510" y="181" width="386" height="77" rx="8" fill="#e9eef5" stroke="#4E79A7" stroke-width="1.5"/><rect x="524" y="195" width="8" height="8" rx="2" fill="#4E79A7"/><text x="540" y="203" font-size="11.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="882" y="203" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="524" y="225" font-size="12.5" fill="#1a1a1a">The novelty of this paper is limited.</text>
<line x1="422" y1="219.5" x2="510" y2="219.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="219.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="224.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="175" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 28</text>
<rect x="36" y="284" width="386" height="111" rx="8" fill="#fbeaea" stroke="#E15759" stroke-width="1.5"/><rect x="50" y="298" width="8" height="8" rx="2" fill="#E15759"/><text x="66" y="306" font-size="11.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="408" y="306" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="50" y="328" font-size="12.5" fill="#1a1a1a">A main weakness is that the work is not</text><text x="50" y="345" font-size="12.5" fill="#1a1a1a">reproducible, with respect to both the methods and</text><text x="50" y="362" font-size="12.5" fill="#1a1a1a">datasets.</text>
<rect x="510" y="284" width="386" height="111" rx="8" fill="#e9eef5" stroke="#4E79A7" stroke-width="1.5"/><rect x="524" y="298" width="8" height="8" rx="2" fill="#4E79A7"/><text x="540" y="306" font-size="11.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="882" y="306" text-anchor="end" font-size="10.5" fill="#6b6b6b">R4</text><text x="524" y="328" font-size="12.5" fill="#1a1a1a">Some experimental setup details are missing, making</text><text x="524" y="345" font-size="12.5" fill="#1a1a1a">the results difficult to be reproduced for now.</text>
<line x1="422" y1="339.5" x2="510" y2="339.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="339.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="344.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="278" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 60</text>
<rect x="36" y="421" width="386" height="94" rx="8" fill="#fbeaea" stroke="#E15759" stroke-width="1.5"/><rect x="50" y="435" width="8" height="8" rx="2" fill="#E15759"/><text x="66" y="443" font-size="11.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Misunderstanding</text><text x="408" y="443" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="50" y="465" font-size="12.5" fill="#1a1a1a">Many Transformer variants for long sequences exist,</text><text x="50" y="482" font-size="12.5" fill="#1a1a1a">but none of them is compared.</text>
<rect x="510" y="421" width="386" height="94" rx="8" fill="#e9eef5" stroke="#4E79A7" stroke-width="1.5"/><rect x="524" y="435" width="8" height="8" rx="2" fill="#4E79A7"/><text x="540" y="443" font-size="11.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="882" y="443" text-anchor="end" font-size="10.5" fill="#6b6b6b">R4</text><text x="524" y="465" font-size="12.5" fill="#1a1a1a">My major concern is the lack of comparison of other</text><text x="524" y="482" font-size="12.5" fill="#1a1a1a">baselines.</text>
<line x1="422" y1="468.0" x2="510" y2="468.0" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="468.0" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="473.0" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="415" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 46</text>
<rect x="36" y="541" width="386" height="94" rx="8" fill="#fbeaea" stroke="#E15759" stroke-width="1.5"/><rect x="50" y="555" width="8" height="8" rx="2" fill="#E15759"/><text x="66" y="563" font-size="11.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="408" y="563" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="50" y="585" font-size="12.5" fill="#1a1a1a">I feel like the authors didn&#x27;t convey an incentive</text><text x="50" y="602" font-size="12.5" fill="#1a1a1a">for this.</text>
<rect x="510" y="541" width="386" height="94" rx="8" fill="#e9eef5" stroke="#4E79A7" stroke-width="1.5"/><rect x="524" y="555" width="8" height="8" rx="2" fill="#4E79A7"/><text x="540" y="563" font-size="11.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="882" y="563" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="524" y="585" font-size="12.5" fill="#1a1a1a">The authors should answer: how could the paper</text><text x="524" y="602" font-size="12.5" fill="#1a1a1a">findings benefit the community?</text>
<line x1="422" y1="588.0" x2="510" y2="588.0" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="588.0" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="593.0" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="535" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 97</text>
</svg>