<svg xmlns="http://www.w3.org/2000/svg" width="932" height="733" viewBox="0 0 932 733" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="932" height="733" fill="#ffffff"/>
<text x="466.0" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#A6192E">Same weakness, opposite human reliability labels</text>
<text x="466.0" y="62" text-anchor="middle" font-size="13" fill="#6b6b6b">Strict same-issue matched pairs from ReviewCritique where the two reviewers received different labels</text>
<text x="229.0" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6b6b">REVIEWER A</text>
<text x="703.0" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6b6b">REVIEWER B</text>
<rect x="36" y="96" width="386" height="111" rx="8" fill="#f7e7ea" stroke="#A6192E" stroke-width="1.5"/><rect x="50" y="110" width="8" height="8" rx="2" fill="#A6192E"/><text x="66" y="118" font-size="11.5" font-weight="700" fill="#A6192E" letter-spacing="0.3">UNRELIABLE · Vague Critique</text><text x="408" y="118" text-anchor="end" font-size="10.5" fill="#6b6b6b">R1</text><text x="50" y="140" font-size="12.5" fill="#1a1a1a">There is not much novelty in the methodological</text><text x="50" y="157" font-size="12.5" fill="#1a1a1a">aspects of the work.</text>
<rect x="510" y="96" width="386" height="111" rx="8" fill="#e7eef6" stroke="#2E5A88" stroke-width="1.5"/><rect x="524" y="110" width="8" height="8" rx="2" fill="#2E5A88"/><text x="540" y="118" font-size="11.5" font-weight="700" fill="#2E5A88" letter-spacing="0.3">RELIABLE</text><text x="882" y="118" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="524" y="140" font-size="12.5" fill="#1a1a1a">The novelty is primarily empirical; the technical</text><text x="524" y="157" font-size="12.5" fill="#1a1a1a">approach is essentially an application of known</text><text x="524" y="174" font-size="12.5" fill="#1a1a1a">techniques (standard pretrain-finetune of LLMs).</text>
<line x1="422" y1="151.5" x2="510" y2="151.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="151.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="156.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="90" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 1</text>
<rect x="36" y="233" width="386" height="77" rx="8" fill="#f7e7ea" stroke="#A6192E" stroke-width="1.5"/><rect x="50" y="247" width="8" height="8" rx="2" fill="#A6192E"/><text x="66" y="255" font-size="11.5" font-weight="700" fill="#A6192E" letter-spacing="0.3">UNRELIABLE · Subjective</text><text x="408" y="255" text-anchor="end" font-size="10.5" fill="#6b6b6b">R1</text><text x="50" y="277" font-size="12.5" fill="#1a1a1a">No novel / brand new ideas.</text>
<rect x="510" y="233" width="386" height="77" rx="8" fill="#e7eef6" stroke="#2E5A88" stroke-width="1.5"/><rect x="524" y="247" width="8" height="8" rx="2" fill="#2E5A88"/><text x="540" y="255" font-size="11.5" font-weight="700" fill="#2E5A88" letter-spacing="0.3">RELIABLE</text><text x="882" y="255" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="524" y="277" font-size="12.5" fill="#1a1a1a">The novelty of this paper is limited.</text>
<line x1="422" y1="271.5" x2="510" y2="271.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="271.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="276.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="227" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 28</text>
<rect x="36" y="336" width="386" height="111" rx="8" fill="#f7e7ea" stroke="#A6192E" stroke-width="1.5"/><rect x="50" y="350" width="8" height="8" rx="2" fill="#A6192E"/><text x="66" y="358" font-size="11.5" font-weight="700" fill="#A6192E" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="408" y="358" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="50" y="380" font-size="12.5" fill="#1a1a1a">A main weakness is that the work is not</text><text x="50" y="397" font-size="12.5" fill="#1a1a1a">reproducible, with respect to both the methods and</text><text x="50" y="414" font-size="12.5" fill="#1a1a1a">datasets.</text>
<rect x="510" y="336" width="386" height="111" rx="8" fill="#e7eef6" stroke="#2E5A88" stroke-width="1.5"/><rect x="524" y="350" width="8" height="8" rx="2" fill="#2E5A88"/><text x="540" y="358" font-size="11.5" font-weight="700" fill="#2E5A88" letter-spacing="0.3">RELIABLE</text><text x="882" y="358" text-anchor="end" font-size="10.5" fill="#6b6b6b">R4</text><text x="524" y="380" font-size="12.5" fill="#1a1a1a">Some experimental setup details are missing, making</text><text x="524" y="397" font-size="12.5" fill="#1a1a1a">the results difficult to be reproduced for now.</text>
<line x1="422" y1="391.5" x2="510" y2="391.5" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="391.5" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="396.5" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="330" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 60</text>
<rect x="36" y="473" width="386" height="94" rx="8" fill="#f7e7ea" stroke="#A6192E" stroke-width="1.5"/><rect x="50" y="487" width="8" height="8" rx="2" fill="#A6192E"/><text x="66" y="495" font-size="11.5" font-weight="700" fill="#A6192E" letter-spacing="0.3">UNRELIABLE · Misunderstanding</text><text x="408" y="495" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="50" y="517" font-size="12.5" fill="#1a1a1a">Many Transformer variants for long sequences exist,</text><text x="50" y="534" font-size="12.5" fill="#1a1a1a">but none of them is compared.</text>
<rect x="510" y="473" width="386" height="94" rx="8" fill="#e7eef6" stroke="#2E5A88" stroke-width="1.5"/><rect x="524" y="487" width="8" height="8" rx="2" fill="#2E5A88"/><text x="540" y="495" font-size="11.5" font-weight="700" fill="#2E5A88" letter-spacing="0.3">RELIABLE</text><text x="882" y="495" text-anchor="end" font-size="10.5" fill="#6b6b6b">R4</text><text x="524" y="517" font-size="12.5" fill="#1a1a1a">My major concern is the lack of comparison of other</text><text x="524" y="534" font-size="12.5" fill="#1a1a1a">baselines.</text>
<line x1="422" y1="520.0" x2="510" y2="520.0" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="520.0" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="525.0" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="467" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 46</text>
<rect x="36" y="593" width="386" height="94" rx="8" fill="#f7e7ea" stroke="#A6192E" stroke-width="1.5"/><rect x="50" y="607" width="8" height="8" rx="2" fill="#A6192E"/><text x="66" y="615" font-size="11.5" font-weight="700" fill="#A6192E" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="408" y="615" text-anchor="end" font-size="10.5" fill="#6b6b6b">R3</text><text x="50" y="637" font-size="12.5" fill="#1a1a1a">I feel like the authors didn&#x27;t convey an incentive</text><text x="50" y="654" font-size="12.5" fill="#1a1a1a">for this.</text>
<rect x="510" y="593" width="386" height="94" rx="8" fill="#e7eef6" stroke="#2E5A88" stroke-width="1.5"/><rect x="524" y="607" width="8" height="8" rx="2" fill="#2E5A88"/><text x="540" y="615" font-size="11.5" font-weight="700" fill="#2E5A88" letter-spacing="0.3">RELIABLE</text><text x="882" y="615" text-anchor="end" font-size="10.5" fill="#6b6b6b">R2</text><text x="524" y="637" font-size="12.5" fill="#1a1a1a">The authors should answer: how could the paper</text><text x="524" y="654" font-size="12.5" fill="#1a1a1a">findings benefit the community?</text>
<line x1="422" y1="640.0" x2="510" y2="640.0" stroke="#cfd4da" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="466.0" cy="640.0" r="15" fill="#fff" stroke="#cfd4da" stroke-width="1.2"/>
<text x="466.0" y="645.0" text-anchor="middle" font-size="15" fill="#6b6b6b">≈</text>
<text x="466.0" y="587" text-anchor="middle" font-size="10" fill="#6b6b6b">paper 97</text>
</svg>