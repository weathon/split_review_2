<svg xmlns="http://www.w3.org/2000/svg" width="970" height="958" viewBox="0 0 970 958" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="970" height="958" fill="#ffffff"/>
<text x="20" y="24" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 1</text>
<line x1="70" y1="21" x2="470" y2="21" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="30" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="18" y="30" width="4" height="58" rx="2" fill="#E15759"/><text x="33" y="51" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Vague Critique</text><text x="459" y="51" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="33" y="66" font-size="12" fill="#1b1b1b">Not much novelty in the methodological aspects of the work.</text>
<rect x="18" y="92" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="18" y="92" width="4" height="74" rx="2" fill="#4E79A7"/><text x="33" y="113" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="113" text-anchor="end" font-size="9.5" fill="#6b6b6b">R3</text><text x="33" y="128" font-size="12" fill="#1b1b1b">The novelty is primarily empirical; the approach applies known</text><text x="33" y="144" font-size="12" fill="#1b1b1b">techniques.</text>
<text x="20" y="175" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 28</text>
<line x1="70" y1="172" x2="470" y2="172" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="181" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="18" y="181" width="4" height="58" rx="2" fill="#E15759"/><text x="33" y="202" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Subjective</text><text x="459" y="202" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="33" y="217" font-size="12" fill="#1b1b1b">No novel / brand new ideas.</text>
<rect x="18" y="243" width="452" height="58" rx="6" fill="#e9eef5"/><rect x="18" y="243" width="4" height="58" rx="2" fill="#4E79A7"/><text x="33" y="264" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="264" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="33" y="279" font-size="12" fill="#1b1b1b">The novelty of this paper is limited.</text>
<text x="20" y="310" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 60</text>
<line x1="70" y1="307" x2="470" y2="307" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="316" width="452" height="74" rx="6" fill="#fbeaea"/><rect x="18" y="316" width="4" height="74" rx="2" fill="#E15759"/><text x="33" y="337" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="459" y="337" text-anchor="end" font-size="9.5" fill="#6b6b6b">R3</text><text x="33" y="352" font-size="12" fill="#1b1b1b">The work is not reproducible, w.r.t. both methods and</text><text x="33" y="368" font-size="12" fill="#1b1b1b">datasets.</text>
<rect x="18" y="394" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="18" y="394" width="4" height="74" rx="2" fill="#4E79A7"/><text x="33" y="415" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="415" text-anchor="end" font-size="9.5" fill="#6b6b6b">R4</text><text x="33" y="430" font-size="12" fill="#1b1b1b">Experimental setup details are missing, making results hard to</text><text x="33" y="446" font-size="12" fill="#1b1b1b">reproduce.</text>
<text x="20" y="477" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 46</text>
<line x1="70" y1="474" x2="470" y2="474" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="483" width="452" height="74" rx="6" fill="#fbeaea"/><rect x="18" y="483" width="4" height="74" rx="2" fill="#E15759"/><text x="33" y="504" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Misunderstanding</text><text x="459" y="504" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="33" y="519" font-size="12" fill="#1b1b1b">Many Transformer variants for long sequences exist, but none</text><text x="33" y="535" font-size="12" fill="#1b1b1b">is compared.</text>
<rect x="18" y="561" width="452" height="58" rx="6" fill="#e9eef5"/><rect x="18" y="561" width="4" height="58" rx="2" fill="#4E79A7"/><text x="33" y="582" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="582" text-anchor="end" font-size="9.5" fill="#6b6b6b">R4</text><text x="33" y="597" font-size="12" fill="#1b1b1b">My major concern is the lack of comparison of other baselines.</text>
<text x="20" y="628" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 20</text>
<line x1="70" y1="625" x2="470" y2="625" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="634" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="18" y="634" width="4" height="58" rx="2" fill="#E15759"/><text x="33" y="655" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Vague Critique</text><text x="459" y="655" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="33" y="670" font-size="12" fill="#1b1b1b">Improvements over the baselines are not fully convincing.</text>
<rect x="18" y="696" width="452" height="58" rx="6" fill="#e9eef5"/><rect x="18" y="696" width="4" height="58" rx="2" fill="#4E79A7"/><text x="33" y="717" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="717" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="33" y="732" font-size="12" fill="#1b1b1b">The performance gains (esp. the new loss) are marginal.</text>
<text x="20" y="763" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 55</text>
<line x1="70" y1="760" x2="470" y2="760" stroke="#e0e0e0" stroke-width="1"/>
<rect x="18" y="769" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="18" y="769" width="4" height="58" rx="2" fill="#E15759"/><text x="33" y="790" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Vague Critique</text><text x="459" y="790" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="33" y="805" font-size="12" fill="#1b1b1b">Lots of experimental results that are not well explained.</text>
<rect x="18" y="831" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="18" y="831" width="4" height="74" rx="2" fill="#4E79A7"/><text x="33" y="852" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="459" y="852" text-anchor="end" font-size="9.5" fill="#6b6b6b">R3</text><text x="33" y="867" font-size="12" fill="#1b1b1b">Hard to understand the experiment sections without the</text><text x="33" y="883" font-size="12" fill="#1b1b1b">appendix.</text>
<text x="502" y="24" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 66</text>
<line x1="552" y1="21" x2="952" y2="21" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="30" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="500" y="30" width="4" height="58" rx="2" fill="#E15759"/><text x="515" y="51" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Misunderstanding</text><text x="941" y="51" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="515" y="66" font-size="12" fill="#1b1b1b">The performance of downstream tasks can also be important.</text>
<rect x="500" y="92" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="500" y="92" width="4" height="74" rx="2" fill="#4E79A7"/><text x="515" y="113" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="113" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="128" font-size="12" fill="#1b1b1b">I encourage the authors to also observe downstream</text><text x="515" y="144" font-size="12" fill="#1b1b1b">performance.</text>
<text x="502" y="175" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 50</text>
<line x1="552" y1="172" x2="952" y2="172" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="181" width="452" height="74" rx="6" fill="#fbeaea"/><rect x="500" y="181" width="4" height="74" rx="2" fill="#E15759"/><text x="515" y="202" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Misunderstanding</text><text x="941" y="202" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="217" font-size="12" fill="#1b1b1b">The claim that flatness decides downstream performance is not</text><text x="515" y="233" font-size="12" fill="#1b1b1b">well-supported.</text>
<rect x="500" y="259" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="500" y="259" width="4" height="74" rx="2" fill="#4E79A7"/><text x="515" y="280" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="280" text-anchor="end" font-size="9.5" fill="#6b6b6b">R3</text><text x="515" y="295" font-size="12" fill="#1b1b1b">Unclear that flatter minima lead to better generalization; no</text><text x="515" y="311" font-size="12" fill="#1b1b1b">baselines.</text>
<text x="502" y="342" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 55</text>
<line x1="552" y1="339" x2="952" y2="339" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="348" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="500" y="348" width="4" height="58" rx="2" fill="#E15759"/><text x="515" y="369" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="941" y="369" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="515" y="384" font-size="12" fill="#1b1b1b">Uses “fairness” without explaining how fairness is measured.</text>
<rect x="500" y="410" width="452" height="58" rx="6" fill="#e9eef5"/><rect x="500" y="410" width="4" height="58" rx="2" fill="#4E79A7"/><text x="515" y="431" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="431" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="446" font-size="12" fill="#1b1b1b">Authors could be clearer on what fairness metric is used.</text>
<text x="502" y="477" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 93</text>
<line x1="552" y1="474" x2="952" y2="474" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="483" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="500" y="483" width="4" height="74" rx="2" fill="#4E79A7"/><text x="515" y="504" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="504" text-anchor="end" font-size="9.5" fill="#6b6b6b">R1</text><text x="515" y="519" font-size="12" fill="#1b1b1b">Not clear where the results are significantly different among</text><text x="515" y="535" font-size="12" fill="#1b1b1b">systems.</text>
<rect x="500" y="561" width="452" height="74" rx="6" fill="#fbeaea"/><rect x="500" y="561" width="4" height="74" rx="2" fill="#E15759"/><text x="515" y="582" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Inexpert Statement</text><text x="941" y="582" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="597" font-size="12" fill="#1b1b1b">Methods perform only comparably to the ensemble, not</text><text x="515" y="613" font-size="12" fill="#1b1b1b">significantly better.</text>
<text x="502" y="644" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 35</text>
<line x1="552" y1="641" x2="952" y2="641" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="650" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="500" y="650" width="4" height="74" rx="2" fill="#4E79A7"/><text x="515" y="671" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="671" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="686" font-size="12" fill="#1b1b1b">Unifies existing approaches for prompt tuning; marginally</text><text x="515" y="702" font-size="12" fill="#1b1b1b">novel.</text>
<rect x="500" y="728" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="500" y="728" width="4" height="58" rx="2" fill="#E15759"/><text x="515" y="749" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Misinterpret Novelty</text><text x="941" y="749" text-anchor="end" font-size="9.5" fill="#6b6b6b">R4</text><text x="515" y="764" font-size="12" fill="#1b1b1b">The actual method is a simple combination of existing ideas.</text>
<text x="502" y="795" font-size="9.5" font-weight="600" fill="#6b6b6b">PAPER 97</text>
<line x1="552" y1="792" x2="952" y2="792" stroke="#e0e0e0" stroke-width="1"/>
<rect x="500" y="801" width="452" height="74" rx="6" fill="#e9eef5"/><rect x="500" y="801" width="4" height="74" rx="2" fill="#4E79A7"/><text x="515" y="822" font-size="10.5" font-weight="700" fill="#4E79A7" letter-spacing="0.3">RELIABLE</text><text x="941" y="822" text-anchor="end" font-size="9.5" fill="#6b6b6b">R2</text><text x="515" y="837" font-size="12" fill="#1b1b1b">Authors should answer: how could the findings benefit the</text><text x="515" y="853" font-size="12" fill="#1b1b1b">community?</text>
<rect x="500" y="879" width="452" height="58" rx="6" fill="#fbeaea"/><rect x="500" y="879" width="4" height="58" rx="2" fill="#E15759"/><text x="515" y="900" font-size="10.5" font-weight="700" fill="#E15759" letter-spacing="0.3">UNRELIABLE · Neglect</text><text x="941" y="900" text-anchor="end" font-size="9.5" fill="#6b6b6b">R3</text><text x="515" y="915" font-size="12" fill="#1b1b1b">Didn&#x27;t convey an incentive for this.</text>
</svg>