<svg xmlns="http://www.w3.org/2000/svg" width="992" height="481" viewBox="0 0 992 481" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="992" height="481" fill="#ffffff"/>
<text x="20" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(a) near-identical weaknesses, opposite labels</text>
<text x="526" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(b) different weaknesses, sensible labels</text>
<line x1="496" y1="12" x2="496" y2="469" stroke="#c9ced6" stroke-width="1.2"/>
<rect x="20" y="34" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="34" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="52" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Subjective</text><text x="223" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="64" font-size="11" fill="#1b1b1b">No novel / brand new ideas.</text>
<rect x="254" y="34" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="254" y="34" width="4" height="78" rx="2" fill="#4E79A7"/><text x="266" y="52" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="457" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="266" y="64" font-size="11" fill="#1b1b1b">The novelty of this paper is</text><text x="266" y="78" font-size="11" fill="#1b1b1b">limited.</text>
<circle cx="243.0" cy="73.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="243.0" y="77.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="31" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 28</text>
<rect x="526" y="34" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="526" y="34" width="4" height="78" rx="2" fill="#4E79A7"/><text x="538" y="52" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="538" y="64" font-size="11" fill="#1b1b1b">In many tasks the 6B model already</text><text x="538" y="78" font-size="11" fill="#1b1b1b">beats the 175B without the proposed</text><text x="538" y="92" font-size="11" fill="#1b1b1b">aggregation.</text>
<rect x="760" y="34" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="760" y="34" width="4" height="78" rx="2" fill="#E15759"/><text x="772" y="52" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="772" y="64" font-size="11" fill="#1b1b1b">Results are not particularly</text><text x="772" y="78" font-size="11" fill="#1b1b1b">surprising.</text>
<circle cx="749.0" cy="73.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="749.0" y="77.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="127" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="127" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="145" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="223" y="145" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="157" font-size="11" fill="#1b1b1b">Not reproducible, w.r.t. both</text><text x="32" y="171" font-size="11" fill="#1b1b1b">methods and datasets.</text>
<rect x="254" y="127" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="254" y="127" width="4" height="78" rx="2" fill="#4E79A7"/><text x="266" y="145" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="457" y="145" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="266" y="157" font-size="11" fill="#1b1b1b">Setup details missing, results hard</text><text x="266" y="171" font-size="11" fill="#1b1b1b">to reproduce.</text>
<circle cx="243.0" cy="166.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="243.0" y="170.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="124" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 60</text>
<rect x="526" y="127" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="526" y="127" width="4" height="78" rx="2" fill="#4E79A7"/><text x="538" y="145" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="538" y="157" font-size="11" fill="#1b1b1b">Only one pretrained model</text><text x="538" y="171" font-size="11" fill="#1b1b1b">(T5-small) is tested; may not</text><text x="538" y="185" font-size="11" fill="#1b1b1b">transfer to larger models.</text>
<rect x="760" y="127" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="760" y="127" width="4" height="78" rx="2" fill="#E15759"/><text x="772" y="145" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="772" y="157" font-size="11" fill="#1b1b1b">The way to add structural locality</text><text x="772" y="171" font-size="11" fill="#1b1b1b">is straightforward.</text>
<circle cx="749.0" cy="166.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="749.0" y="170.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="220" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="220" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="238" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Misunderstanding</text><text x="223" y="238" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="32" y="250" font-size="11" fill="#1b1b1b">Many Transformer variants exist,</text><text x="32" y="264" font-size="11" fill="#1b1b1b">but none is compared.</text>
<rect x="254" y="220" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="254" y="220" width="4" height="78" rx="2" fill="#4E79A7"/><text x="266" y="238" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="457" y="238" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="266" y="250" font-size="11" fill="#1b1b1b">Concern is the lack of comparison</text><text x="266" y="264" font-size="11" fill="#1b1b1b">of other baselines.</text>
<circle cx="243.0" cy="259.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="243.0" y="263.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="217" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 46</text>
<rect x="526" y="220" width="212" height="78" rx="6" fill="#e9eef5"/><rect x="526" y="220" width="4" height="78" rx="2" fill="#4E79A7"/><text x="538" y="238" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="538" y="250" font-size="11" fill="#1b1b1b">Observation experiments not</text><text x="538" y="264" font-size="11" fill="#1b1b1b">extensive enough — why only 3 tasks</text><text x="538" y="278" font-size="11" fill="#1b1b1b">(CB, WSC, RTE)?</text>
<rect x="760" y="220" width="212" height="78" rx="6" fill="#fbeaea"/><rect x="760" y="220" width="4" height="78" rx="2" fill="#E15759"/><text x="772" y="238" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="772" y="250" font-size="11" fill="#1b1b1b">SentBERT → SentenceBERT or SBERT.</text>
<circle cx="749.0" cy="259.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="749.0" y="263.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="313" width="212" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="313" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="331" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Vague Critique</text><text x="223" y="331" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="343" font-size="11" fill="#1b1b1b">Improvements over the baselines are</text><text x="32" y="357" font-size="11" fill="#1b1b1b">not fully convincing.</text>
<rect x="254" y="313" width="212" height="64" rx="6" fill="#e9eef5"/><rect x="254" y="313" width="4" height="64" rx="2" fill="#4E79A7"/><text x="266" y="331" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="457" y="331" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="266" y="343" font-size="11" fill="#1b1b1b">The performance gains are marginal.</text>
<circle cx="243.0" cy="345.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="243.0" y="349.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="310" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 20</text>
<rect x="526" y="313" width="212" height="64" rx="6" fill="#e9eef5"/><rect x="526" y="313" width="4" height="64" rx="2" fill="#4E79A7"/><text x="538" y="331" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="538" y="343" font-size="11" fill="#1b1b1b">This table is not apples-to-apples,</text><text x="538" y="357" font-size="11" fill="#1b1b1b">making it hard to interpret.</text>
<rect x="760" y="313" width="212" height="64" rx="6" fill="#fbeaea"/><rect x="760" y="313" width="4" height="64" rx="2" fill="#E15759"/><text x="772" y="331" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="772" y="343" font-size="11" fill="#1b1b1b">I&#x27;d like to see results on stronger</text><text x="772" y="357" font-size="11" fill="#1b1b1b">models, like RoBERTa.</text>
<circle cx="749.0" cy="345.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="749.0" y="349.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="392" width="212" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="392" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="410" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="223" y="410" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="422" font-size="11" fill="#1b1b1b">Didn&#x27;t convey an incentive for</text><text x="32" y="436" font-size="11" fill="#1b1b1b">this.</text>
<rect x="254" y="392" width="212" height="64" rx="6" fill="#e9eef5"/><rect x="254" y="392" width="4" height="64" rx="2" fill="#4E79A7"/><text x="266" y="410" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="457" y="410" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="266" y="422" font-size="11" fill="#1b1b1b">Should answer: how do the findings</text><text x="266" y="436" font-size="11" fill="#1b1b1b">benefit the community?</text>
<circle cx="243.0" cy="424.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="243.0" y="428.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="389" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 97</text>
<rect x="526" y="392" width="212" height="64" rx="6" fill="#e9eef5"/><rect x="526" y="392" width="4" height="64" rx="2" fill="#4E79A7"/><text x="538" y="410" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="538" y="422" font-size="11" fill="#1b1b1b">This introduces additional latency</text><text x="538" y="436" font-size="11" fill="#1b1b1b">for task adaptation.</text>
<rect x="760" y="392" width="212" height="64" rx="6" fill="#fbeaea"/><rect x="760" y="392" width="4" height="64" rx="2" fill="#E15759"/><text x="772" y="410" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="772" y="422" font-size="11" fill="#1b1b1b">The proposed method is hard to</text><text x="772" y="436" font-size="11" fill="#1b1b1b">transfer to other domains.</text>
<circle cx="749.0" cy="424.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="749.0" y="428.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
</svg>