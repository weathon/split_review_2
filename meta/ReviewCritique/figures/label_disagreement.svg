<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495" viewBox="0 0 1000 495" font-family="'Helvetica Neue',Arial,sans-serif">
<rect width="1000" height="495" fill="#ffffff"/>
<text x="20" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(a) near-identical weaknesses, opposite labels</text>
<text x="530" y="20" font-size="12" font-weight="700" fill="#1b1b1b">(b) different weaknesses, sensible labels</text>
<line x1="500" y1="12" x2="500" y2="483" stroke="#c9ced6" stroke-width="1.2"/>
<rect x="20" y="34" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="34" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="52" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Subjective</text><text x="225" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="64" font-size="11" fill="#1b1b1b">No novel / brand new ideas.</text>
<rect x="256" y="34" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="256" y="34" width="4" height="78" rx="2" fill="#4E79A7"/><text x="268" y="52" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="461" y="52" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="268" y="64" font-size="11" fill="#1b1b1b">The novelty of this paper is</text><text x="268" y="78" font-size="11" fill="#1b1b1b">limited.</text>
<circle cx="245.0" cy="73.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="245.0" y="77.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="31" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 28</text>
<rect x="530" y="34" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="530" y="34" width="4" height="78" rx="2" fill="#4E79A7"/><text x="542" y="52" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="542" y="64" font-size="11" fill="#1b1b1b">In many tasks the 6B model already</text><text x="542" y="78" font-size="11" fill="#1b1b1b">beats the 175B without weak-</text><text x="542" y="92" font-size="11" fill="#1b1b1b">supervision aggregation.</text>
<rect x="766" y="34" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="766" y="34" width="4" height="78" rx="2" fill="#E15759"/><text x="778" y="52" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="778" y="64" font-size="11" fill="#1b1b1b">Results are not particularly</text><text x="778" y="78" font-size="11" fill="#1b1b1b">surprising.</text>
<circle cx="755.0" cy="73.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="755.0" y="77.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="127" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="127" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="145" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="225" y="145" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="157" font-size="11" fill="#1b1b1b">Not reproducible, w.r.t. both</text><text x="32" y="171" font-size="11" fill="#1b1b1b">methods and datasets.</text>
<rect x="256" y="127" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="256" y="127" width="4" height="78" rx="2" fill="#4E79A7"/><text x="268" y="145" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="461" y="145" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="268" y="157" font-size="11" fill="#1b1b1b">Setup details missing, results hard</text><text x="268" y="171" font-size="11" fill="#1b1b1b">to reproduce.</text>
<circle cx="245.0" cy="166.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="245.0" y="170.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="124" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 60</text>
<rect x="530" y="127" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="530" y="127" width="4" height="78" rx="2" fill="#4E79A7"/><text x="542" y="145" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="542" y="157" font-size="11" fill="#1b1b1b">This table is not really apples-to-</text><text x="542" y="171" font-size="11" fill="#1b1b1b">apples, making it hard to</text><text x="542" y="185" font-size="11" fill="#1b1b1b">interpret.</text>
<rect x="766" y="127" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="766" y="127" width="4" height="78" rx="2" fill="#E15759"/><text x="778" y="145" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Invalid Criticism</text><text x="778" y="157" font-size="11" fill="#1b1b1b">The way to add structural locality</text><text x="778" y="171" font-size="11" fill="#1b1b1b">is straightforward.</text>
<circle cx="755.0" cy="166.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="755.0" y="170.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="220" width="214" height="64" rx="6" fill="#fbeaea"/><rect x="20" y="220" width="4" height="64" rx="2" fill="#E15759"/><text x="32" y="238" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Misunderstanding</text><text x="225" y="238" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="32" y="250" font-size="11" fill="#1b1b1b">Many Transformer variants exist,</text><text x="32" y="264" font-size="11" fill="#1b1b1b">but none is compared.</text>
<rect x="256" y="220" width="214" height="64" rx="6" fill="#e9eef5"/><rect x="256" y="220" width="4" height="64" rx="2" fill="#4E79A7"/><text x="268" y="238" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="461" y="238" text-anchor="end" font-size="8.5" fill="#6b6b6b">R4</text><text x="268" y="250" font-size="11" fill="#1b1b1b">Concern is the lack of comparison</text><text x="268" y="264" font-size="11" fill="#1b1b1b">of other baselines.</text>
<circle cx="245.0" cy="252.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="245.0" y="256.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="217" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 46</text>
<rect x="530" y="220" width="214" height="64" rx="6" fill="#e9eef5"/><rect x="530" y="220" width="4" height="64" rx="2" fill="#4E79A7"/><text x="542" y="238" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="542" y="250" font-size="11" fill="#1b1b1b">This introduces additional latency</text><text x="542" y="264" font-size="11" fill="#1b1b1b">for task adaptation.</text>
<rect x="766" y="220" width="214" height="64" rx="6" fill="#fbeaea"/><rect x="766" y="220" width="4" height="64" rx="2" fill="#E15759"/><text x="778" y="238" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Superficial Review</text><text x="778" y="250" font-size="11" fill="#1b1b1b">The paper doesn&#x27;t have too many</text><text x="778" y="264" font-size="11" fill="#1b1b1b">weaknesses.</text>
<circle cx="755.0" cy="252.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="755.0" y="256.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="299" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="299" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="317" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Vague Critique</text><text x="225" y="317" text-anchor="end" font-size="8.5" fill="#6b6b6b">R1</text><text x="32" y="329" font-size="11" fill="#1b1b1b">Improvements over the baselines are</text><text x="32" y="343" font-size="11" fill="#1b1b1b">not fully convincing.</text>
<rect x="256" y="299" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="256" y="299" width="4" height="78" rx="2" fill="#4E79A7"/><text x="268" y="317" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="461" y="317" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="268" y="329" font-size="11" fill="#1b1b1b">The performance gains are marginal.</text>
<circle cx="245.0" cy="338.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="245.0" y="342.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="296" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 20</text>
<rect x="530" y="299" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="530" y="299" width="4" height="78" rx="2" fill="#4E79A7"/><text x="542" y="317" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="542" y="329" font-size="11" fill="#1b1b1b">No significant HTML structure</text><text x="542" y="343" font-size="11" fill="#1b1b1b">understanding is needed for these</text><text x="542" y="357" font-size="11" fill="#1b1b1b">tasks.</text>
<rect x="766" y="299" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="766" y="299" width="4" height="78" rx="2" fill="#E15759"/><text x="778" y="317" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Misunderstanding</text><text x="778" y="329" font-size="11" fill="#1b1b1b">The metric “precision@1” should be</text><text x="778" y="343" font-size="11" fill="#1b1b1b">called “accuracy@1”.</text>
<circle cx="755.0" cy="338.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="755.0" y="342.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
<rect x="20" y="392" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="20" y="392" width="4" height="78" rx="2" fill="#E15759"/><text x="32" y="410" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Neglect</text><text x="225" y="410" text-anchor="end" font-size="8.5" fill="#6b6b6b">R3</text><text x="32" y="422" font-size="11" fill="#1b1b1b">Didn&#x27;t convey an incentive for</text><text x="32" y="436" font-size="11" fill="#1b1b1b">this.</text>
<rect x="256" y="392" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="256" y="392" width="4" height="78" rx="2" fill="#4E79A7"/><text x="268" y="410" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="461" y="410" text-anchor="end" font-size="8.5" fill="#6b6b6b">R2</text><text x="268" y="422" font-size="11" fill="#1b1b1b">Should answer: how do the findings</text><text x="268" y="436" font-size="11" fill="#1b1b1b">benefit the community?</text>
<circle cx="245.0" cy="431.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="245.0" y="435.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≈</text>
<text x="22" y="389" font-size="8.5" font-weight="600" fill="#6b6b6b">PAPER 97</text>
<rect x="530" y="392" width="214" height="78" rx="6" fill="#e9eef5"/><rect x="530" y="392" width="4" height="78" rx="2" fill="#4E79A7"/><text x="542" y="410" font-size="9.5" font-weight="700" fill="#4E79A7">RELIABLE</text><text x="542" y="422" font-size="11" fill="#1b1b1b">Perhaps worth using those as</text><text x="542" y="436" font-size="11" fill="#1b1b1b">baselines, or saying why they</text><text x="542" y="450" font-size="11" fill="#1b1b1b">weren&#x27;t used.</text>
<rect x="766" y="392" width="214" height="78" rx="6" fill="#fbeaea"/><rect x="766" y="392" width="4" height="78" rx="2" fill="#E15759"/><text x="778" y="410" font-size="9.5" font-weight="700" fill="#E15759">UNRELIABLE · Out-of-scope</text><text x="778" y="422" font-size="11" fill="#1b1b1b">Another concern is the efficiency</text><text x="778" y="436" font-size="11" fill="#1b1b1b">at inference time.</text>
<circle cx="755.0" cy="431.0" r="10" fill="#fff" stroke="#cfd4da" stroke-width="1"/><text x="755.0" y="435.0" text-anchor="middle" font-size="11" fill="#6b6b6b">≠</text>
</svg>